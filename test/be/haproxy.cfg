global
    stats socket /tmp/haproxy-be.sock mode 666 level admin

listen stats
    mode http
    bind *:8002
    stats uri /
    stats admin if TRUE
    stats refresh 10s

frontend otel-test-be-frontend
    bind *:11080
    default_backend servers-backend

    # OTel filter
    filter opentelemetry id otel-test-be config be/otel.cfg

    # Demonstrate the 'otel.context' sample fetch: report, via response
    # headers, whether the upstream span context was extracted and valid.
    acl otel-ctx-valid otel.context(otel-ctx)
    acl otel-ctx-seen  otel.context(otel-ctx) -m found
    http-response set-header X-Otel-Ctx-Valid 1 if otel-ctx-valid
    http-response set-header X-Otel-Ctx-Seen  1 if otel-ctx-seen

backend servers-backend
    server server-1 127.0.0.1:8000
