[otel-test-optctx]
    otel-instrumentation otel-test-instrumentation
        config optctx/otel.yml
#       log localhost:514 local7 debug
        option dontlog-normal
        option hard-errors
        no option disabled
        rate-limit 100.0

        # Reports whether a valid upstream context arrived with the request.
        # The fetch answers only once the extraction has run, so the scope
        # that extracts is listed, and runs, before the two branches.
        acl otel-ctx-valid otel.context(-otel-ctx)

        scopes http_request_extract
        scopes http_request_child
        scopes http_request_new
        scopes http_request
        scopes http_response
        scopes session_end

    # The '-' prefix reads the bare 'traceparent' and 'tracestate' headers an
    # instrumented client sends.  A request without them is not an error, the
    # extraction is simply skipped.
    otel-scope http_request_extract
        extract "-otel-ctx" use-headers
        otel-event on-frontend-http-request

    # A valid context arrived: the session span continues that trace.
    otel-scope http_request_child
        span "HAProxy session" parent "-otel-ctx" root
            attribute "haproxy.trace_continued" int(1)
        otel-event on-frontend-http-request if otel-ctx-valid

    # Nothing usable arrived: the session span starts a trace of its own.
    otel-scope http_request_new
        span "HAProxy session" root
            attribute "haproxy.trace_continued" int(0)
        otel-event on-frontend-http-request unless otel-ctx-valid

    # From here on both cases are the same.
    otel-scope http_request
        span "HTTP request" parent "HAProxy session"
            attribute "http.method" method
            attribute "http.url" url
        otel-event on-frontend-http-request

    otel-scope http_response
        span "HTTP response" parent "HAProxy session"
            attribute "http.status_code" status
        otel-event on-http-response

    # The spans and the extracted context close here, after the HTTP rules of
    # the frontend have run: a 'finish *' on on-http-response would drop the
    # context before the response rules can read it with 'otel.context'.
    otel-scope session_end
        finish *
        otel-event on-server-session-end
