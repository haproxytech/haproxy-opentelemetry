global
    stats socket /tmp/haproxy.sock mode 666 level admin

listen stats
    mode http
    bind *:8001
    stats uri /
    stats admin if TRUE
    stats refresh 10s

frontend otel-test-optctx-frontend
    bind *:10080
    default_backend servers-backend

    # OTel filter
    filter opentelemetry id otel-test-optctx config optctx/otel.cfg

    # Report which of the two root-span scopes ran, so that a plain curl
    # shows the decision the filter made.
    acl otel-ctx-valid otel.context(-otel-ctx)
    http-response set-header X-Otel-Trace-Continued 1 if otel-ctx-valid
    http-response set-header X-Otel-Trace-Continued 0 unless otel-ctx-valid

backend servers-backend
    server server-1 127.0.0.1:8000
