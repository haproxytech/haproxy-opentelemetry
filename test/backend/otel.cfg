[backend-test]
    otel-instrumentation backend-instr
        config "${OTEL_BACKEND_DIR}/otel.yml"
        groups backend-group
        scopes backend-request

    otel-group backend-group
        scopes backend-request

    otel-scope backend-request
        span backend-span root
        otel-event on-backend-http-request

[backend-test-off]
    otel-instrumentation backend-off-instr
        config "${OTEL_BACKEND_DIR}/otel.yml"
        scopes backend-off-request

    otel-scope backend-off-request
        span backend-off-span root
        otel-event on-backend-http-request
