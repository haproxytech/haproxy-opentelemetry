global
    # Runtime creation must still be able to read the OTel configuration.
    chroot /
    nbthread 1
    maxconn 32
    stats socket "${OTEL_BACKEND_SOCKET}" level admin

defaults otel-backend-defaults
    mode http
    timeout connect 1s
    timeout client  1s
    timeout server  1s

    filter-config otel id backend-test enabled config "${OTEL_BACKEND_DIR}/otel.cfg"
    filter-config otel id backend-test-off config "${OTEL_BACKEND_DIR}/otel.cfg"

    # The action is shared by the proxies inheriting this section, the backend
    # created at runtime included, so its resolution for that backend is part of
    # the runtime creation the test checks.
    http-request otel-group backend-test backend-group

backend startup
