[otel-test-updown]
    otel-instrumentation otel-test-instrumentation
        config updown/otel.yml
        option dontlog-normal
        option hard-errors
        no option disabled
        rate-limit 100.0

        scopes session_start
        scopes session_end

    #
    # Two up-down counters.  'haproxy.sessions.total' takes +1 on every session
    # start, while 'haproxy.sessions.active' records a signed delta supplied
    # through a per-session variable, +1 when a client session starts and -1
    # when it ends, so it tracks the number of open sessions.  'set-var' runs
    # before the instrument within a scope, so the variable holds the right
    # delta when the 'update' form records the measurement.
    #
    otel-scope session_start
        instrument udcnt_int "haproxy.sessions.total" desc "Total client sessions" value int(1) unit "{session}"
        instrument update "haproxy.sessions.total"
        set-var sess.otel_updown_delta int(1)
        instrument udcnt_int "haproxy.sessions.active" desc "Active client sessions" value var(sess.otel_updown_delta) unit "{session}"
        instrument update "haproxy.sessions.active"
        otel-event on-client-session-start

    otel-scope session_end
        set-var sess.otel_updown_delta int(-1)
        instrument update "haproxy.sessions.active"
        otel-event on-client-session-end
