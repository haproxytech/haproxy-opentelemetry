[otel-test-class]
    otel-instrumentation otel-test-class-instr
        config class/otel.yml
        scopes class-request

    otel-scope class-request
        span "class enabled request" root
            attribute "filter.class" str("otel")
        otel-event on-frontend-http-request

[otel-test-class-off]
    otel-instrumentation otel-test-class-off-instr
        config class/otel.yml
        scopes class-off-request

    otel-scope class-off-request
        span "class disabled request" root
        otel-event on-frontend-http-request

[otel-test-class-inherit]
    otel-instrumentation otel-test-class-inherit-instr
        config class/otel.yml
        groups otel-test-class-group

    otel-group otel-test-class-group
        scopes inherit-scope

    otel-scope inherit-scope
        span "inherited group request" root
