global
    stats socket /tmp/haproxy.sock mode 666 level admin

listen stats
    mode http
    bind *:8001
    stats uri /
    stats admin if TRUE
    stats refresh 10s

frontend otel-test-class-frontend
    bind *:10080
    default_backend servers-backend

    # OTel filters declared as instances of the "otel" filter class: the first
    # one enabled, the second one left disabled.
    filter-config otel id otel-test-class enabled config class/otel.cfg
    filter-config otel id otel-test-class-off config class/otel.cfg

backend servers-backend
    server server-1 127.0.0.1:8000

# A filter instance and a group action declared in a named defaults section are
# inherited by the frontend below.  The action is shared by the proxies that
# inherit the section, so it resolves against the filter configuration of the
# proxy that executes it, the enabled instance of this section.
defaults otel-test-class-defaults
    mode http
    timeout connect 1s
    timeout client  1s
    timeout server  1s

    filter-config otel id otel-test-class-inherit enabled config class/otel.cfg
    http-request otel-group otel-test-class-inherit otel-test-class-group

frontend otel-test-class-inherit-frontend
    bind *:10081
    default_backend servers-backend
