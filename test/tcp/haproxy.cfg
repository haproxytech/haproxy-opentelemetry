global
    stats socket /tmp/haproxy.sock mode 666 level admin

listen stats
    mode http
    bind *:8001
    stats uri /
    stats admin if TRUE
    stats refresh 10s

# A TCP-mode proxy: the OTel filter traces the connection on the raw stream and
# counts the forwarded payload via the tcp_payload hook, exposed as the
# 'otel.bytes_in' / 'otel.bytes_out' sample fetches.  The common defaults set
# "mode http", so the proxy must request "mode tcp".
#
# The tcp-request / tcp-response content rules engage the request and response
# content-inspection analysers, and the stick-table drives the sticking and
# store-rules analysers, so that the matching TCP-mode events fire and every
# scope in tcp/otel.cfg is exercised.
frontend otel-test-tcp-frontend
    mode tcp
    bind *:10080

    tcp-request inspect-delay 5s
    tcp-request content accept

    default_backend servers-backend

    # OTel filter
    filter opentelemetry id otel-test-tcp config tcp/otel.cfg

backend servers-backend
    mode tcp

    stick-table type ip size 1k expire 30s
    stick on src

    tcp-request content accept
    tcp-response content accept

    # Engage the server-rules analyser to fire on-process-server-rules-request.
    use-server server-1 if TRUE
    server server-1 127.0.0.1:8000
