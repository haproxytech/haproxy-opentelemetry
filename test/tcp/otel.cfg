[otel-test-tcp]
    otel-instrumentation otel-test-instrumentation
        config tcp/otel.yml
        option dontlog-normal
        option hard-errors
        no option disabled
        rate-limit 100.0

        # Stream lifecycle: the "TCP session" span spans the whole stream.
        scopes stream_start
        scopes idle_timeout
        scopes stream_stop

        # Client side.
        scopes client_session_start
        scopes frontend_tcp_request
        scopes switching_rules
        scopes backend_set
        scopes backend_tcp_request
        scopes server_rules
        scopes rdp_cookie
        scopes sticking_rules

        # Server side and response.
        scopes server_session_start
        scopes tcp_response
        scopes store_rules
        scopes server_unavailable
        scopes server_session_end
        scopes client_session_end

    # Open the session span at stream start; every TCP hook below records its
    # own event onto the live "TCP session" span, and stream stop finishes it.
    # Together these scopes exercise every event that fires on a TCP-mode proxy
    # (the HTTP-only events are rejected with a warning on such a proxy).
    otel-scope stream_start
        span "TCP session" root
            attribute "client.addr"   src str(":") src_port
            attribute "frontend.addr" dst str(":") dst_port
            event "stream-start" "fired" int(1)
        otel-event on-stream-start

    otel-scope client_session_start
        span "TCP session"
            event "client-session-start" "fired" int(1)
        otel-event on-client-session-start

    otel-scope frontend_tcp_request
        span "TCP session"
            event "frontend-tcp-request" "fired" int(1)
        otel-event on-frontend-tcp-request

    otel-scope switching_rules
        span "TCP session"
            event "switching-rules" "fired" int(1)
        otel-event on-switching-rules-request

    otel-scope backend_set
        span "TCP session"
            event "backend-set" "fired" int(1)
        otel-event on-backend-set

    otel-scope backend_tcp_request
        span "TCP session"
            event "backend-tcp-request" "fired" int(1)
        otel-event on-backend-tcp-request

    otel-scope server_rules
        span "TCP session"
            event "server-rules" "fired" int(1)
        otel-event on-process-server-rules-request

    otel-scope rdp_cookie
        span "TCP session"
            event "rdp-cookie" "fired" int(1)
        otel-event on-tcp-rdp-cookie-request

    otel-scope sticking_rules
        span "TCP session"
            event "sticking-rules" "fired" int(1)
        otel-event on-process-sticking-rules-request

    otel-scope server_session_start
        span "TCP session"
            event "server-session-start" "fired" int(1)
        otel-event on-server-session-start

    otel-scope tcp_response
        span "TCP session"
            event "tcp-response" "fired" int(1)
        otel-event on-tcp-response

    otel-scope store_rules
        span "TCP session"
            event "store-rules" "fired" int(1)
        otel-event on-process-store-rules-response

    otel-scope server_unavailable
        span "TCP session"
            event "server-unavailable" "fired" int(1)
        otel-event on-server-unavailable

    otel-scope server_session_end
        span "TCP session"
            event "server-session-end" "fired" int(1)
        otel-event on-server-session-end

    # Close: record the transferred byte volume; the span is finished at stream
    # stop, so its lifetime (stream start -> stop) is the connection duration.
    otel-scope client_session_end
        span "TCP session"
            attribute "tcp.bytes_in"  otel.bytes_in
            attribute "tcp.bytes_out" otel.bytes_out
            event "client-session-end" "fired" int(1)
        otel-event on-client-session-end

    # Periodic heartbeat while the connection is idle (armed for 2s).
    otel-scope idle_timeout
        idle-timeout 2s
        span "TCP session"
            event "idle-timeout" "fired" int(1)
        otel-event on-idle-timeout

    otel-scope stream_stop
        span "TCP session"
            event "stream-stop" "fired" int(1)
        finish *
        otel-event on-stream-stop
