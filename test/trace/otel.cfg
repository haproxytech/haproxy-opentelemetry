[otel-test-trace]
    otel-instrumentation otel-test-instrumentation
        config trace/otel.yml default
        option dontlog-normal
        no option disabled
        rate-limit 100.0

        # The scope of the /other path never runs on the driven traffic, so
        # its ACL mismatch produces a skip record.
        acl acl-trace-other path_beg /other

        scopes session_start
        scopes request_extract
        scopes request
        scopes request_other
        scopes response
        scopes response_error
        scopes server_unavailable
        scopes session_end

    otel-scope session_start
        instrument cnt_int "trace.sessions" desc "Traced sessions" value int(1) unit "{session}"
        span "HAProxy session" root
        otel-event on-client-session-start

    # A request carries no traceparent header, so the extraction records the
    # missing carrier without failing the stream.
    otel-scope request_extract
        extract "-otel-ctx" use-headers
        set-var sess.trace_mark str("mark")
        otel-event on-frontend-http-request

    otel-scope request
        instrument update "trace.sessions"
        span "HTTP request" parent "HAProxy session"
            attribute "http.method" method
        log-record info id 1000 event "http-request" span "HTTP request" attr "http.method" method str("http-request")
        otel-event on-frontend-http-request

    otel-scope request_other
        span "Other request" parent "HAProxy session"
        otel-event on-frontend-http-request if acl-trace-other

    otel-scope response
        span "HTTP response" parent "HTTP request"
            attribute "http.status_code" status
        finish "HTTP request"
        otel-event on-http-response

    # The parent span is created by the server-unavailable scope alone, so it
    # is absent from the runtime context: span creation fails on every
    # response, which is the error episode the soft and hard modes report.
    otel-scope response_error
        span "Failed response" parent "orphan span"
            status "error" str("no such parent")
        otel-event on-http-response

    otel-scope server_unavailable
        span "orphan span" parent "HAProxy session"
        otel-event on-server-unavailable

    otel-scope session_end
        unset-var sess.trace_mark
        finish *
        otel-event on-server-session-end
