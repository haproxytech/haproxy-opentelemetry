#
# HTTP-mode listen proxy for the configuration parser test, used by the cases
# that check the events HAProxy skips when the frontend is the backend.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

listen parser-listen
    bind 127.0.0.1:18093

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

    server server-1 127.0.0.1:18092
