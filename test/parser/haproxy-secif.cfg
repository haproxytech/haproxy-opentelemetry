#
# HTTP-mode proxy whose filter line names the section 'if', used by the case
# that checks the general name rule on the section reference.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18091

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}" if

backend parser-backend
    server server-1 127.0.0.1:18090
