#
# HTTP-mode proxy whose class-mode filter line names no configuration file,
# used by the case that checks the OTel parser still requires one.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18056

    default_backend parser-backend

    filter-config otel id parser

backend parser-backend
    server server-1 127.0.0.1:18055
