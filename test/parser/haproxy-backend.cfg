#
# HTTP-mode proxy pair with the filter line in the backend section, used by
# the cases that check the events a filter attached at backend selection
# never sees.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18095

    default_backend parser-backend

backend parser-backend
    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

    server server-1 127.0.0.1:18094
