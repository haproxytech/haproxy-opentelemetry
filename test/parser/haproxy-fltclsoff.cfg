#
# HTTP-mode proxy whose filter is declared as an instance of the "otel" filter
# class without the "enabled" word, used by the case that checks a disabled
# instance is accepted.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18062

    default_backend parser-backend

    filter-config otel id parser config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18061
