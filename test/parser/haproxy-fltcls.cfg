#
# HTTP-mode proxy whose filter is declared as an enabled instance of the
# "otel" filter class, used by the case that checks the class-mode filter
# line and the ID it passes to the OTel parser.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18064

    default_backend parser-backend

    filter-config otel id parser enabled config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18063
