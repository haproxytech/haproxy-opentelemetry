#
# HTTP-mode proxy whose class-mode filter line carries a word the OTel parser
# does not know, used by the case that checks the instance arguments are
# parsed by the OTel parser and not accepted as written.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18058

    default_backend parser-backend

    filter-config otel id parser bogus config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18057
