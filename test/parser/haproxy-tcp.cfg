#
# TCP-mode proxy for the configuration parser test, used by the cases that
# check the constraints of a proxy carrying no HTTP message.
#
global
    daemon

defaults
    mode tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18097

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18096
