#
# HTTP-mode proxy whose filter line names the ID twice, used by the case
# that checks the keyword is written once.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18081

    default_backend parser-backend

    filter opentelemetry id parser id parser-2 config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18080
