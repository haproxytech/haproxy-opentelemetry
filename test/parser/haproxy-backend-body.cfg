#
# HTTP-mode proxy pair with the filter line in a backend section that asks for
# the request body itself, used by the case that checks the body event a
# filter attached at backend selection does see.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18095

    default_backend parser-backend

backend parser-backend
    option http-buffer-request
    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

    server server-1 127.0.0.1:18094
