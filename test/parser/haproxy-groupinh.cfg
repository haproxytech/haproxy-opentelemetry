#
# A group action and its filter shared through a named defaults section.
#
global
    daemon

defaults parser-group-defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

    filter-config otel id parser enabled config "${OTEL_PARSER_CFG}"
    http-request otel-group parser parser-group

frontend parser-frontend
    bind 127.0.0.1:18066
    http-request return status 200

frontend parser-frontend-2
    bind 127.0.0.1:18065
    http-request return status 200
