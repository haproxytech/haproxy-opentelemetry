#
# HTTP-mode proxy whose filter line ends with the ID keyword, used by the
# case that checks the keyword needs a value.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18074

    default_backend parser-backend

    filter opentelemetry config "${OTEL_PARSER_CFG}" id

backend parser-backend
    server server-1 127.0.0.1:18073
