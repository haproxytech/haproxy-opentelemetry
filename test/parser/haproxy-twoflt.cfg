#
# HTTP-mode proxy with two OTel filters reading their own top-level scopes,
# used by the cases that check the rules across the filter instances.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18089

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"
    filter opentelemetry id parser-2 config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18088
