#
# HTTP-mode proxy that names the OTel scope on its filter line instead of
# taking it from the filter id, used by the cases that check that selection.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18095

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}" parser-section

backend parser-backend
    server server-1 127.0.0.1:18094
