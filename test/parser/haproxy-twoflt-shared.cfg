#
# HTTP-mode proxy with two OTel filters sharing one top-level scope, used by
# the cases that check the shared-scope rules across the filter instances.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18087

    default_backend parser-backend

    filter opentelemetry id flt-1 config "${OTEL_PARSER_CFG}" parser-shared
    filter opentelemetry id flt-2 config "${OTEL_PARSER_CFG}" parser-shared

backend parser-backend
    server server-1 127.0.0.1:18086
