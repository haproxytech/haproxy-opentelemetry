#
# Two HTTP-mode proxies whose OTel filters carry one filter ID, used by the
# case that checks the ID unique over the filters of every proxy.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18077

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

frontend parser-frontend-2
    bind 127.0.0.1:18076

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18075
