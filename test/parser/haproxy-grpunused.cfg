#
# A group action and its filter declared in a named defaults section no proxy
# inherits, used by the case that checks such an action to be refused: the
# filter instances of a defaults section are never finalized, so the action
# resolves to no filter configuration.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18064
    http-request return status 200

defaults parser-group-unused
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

    filter-config otel id parser enabled config "${OTEL_PARSER_CFG}"
    http-request otel-group parser parser-group
