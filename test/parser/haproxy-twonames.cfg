#
# HTTP-mode proxy whose filter line carries a second name after the
# configuration file, used by the case that checks only one is read.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18081

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}" parser extra

backend parser-backend
    server server-1 127.0.0.1:18080
