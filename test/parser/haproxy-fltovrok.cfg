#
# One OTel filter instance written in a defaults section and overridden by the
# only proxy that inherits the section, used by the case that checks an
# override to be accepted once no proxy keeps the inherited copy.
#
global
    daemon

defaults parser-instance-defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

    filter-config otel id parser config "${OTEL_PARSER_CFG}"

frontend parser-frontend
    bind 127.0.0.1:18123

    default_backend parser-backend

    filter-config otel id parser config "${OTEL_PARSER_CFG}"

defaults parser-backend-defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

backend parser-backend
    server server-1 127.0.0.1:18124
