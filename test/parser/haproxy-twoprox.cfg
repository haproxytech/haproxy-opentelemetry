#
# Two HTTP-mode proxies, each with its own OTel filter, used by the case that
# checks that the inject names of filters on different proxies stay free.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18085

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

frontend parser-frontend-2
    bind 127.0.0.1:18084

    default_backend parser-backend

    filter opentelemetry id parser-2 config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18083
