#
# HTTP-mode proxy whose 'otel-group' action names no OTel filter of the
# proxy, used by the case that checks the filter id it carries.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18081

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

    http-request otel-group no-such-flt parser-group

backend parser-backend
    server server-1 127.0.0.1:18080
