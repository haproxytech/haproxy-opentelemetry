#
# One OTel filter instance written in a defaults section and inherited by two
# proxies, used by the case that checks the copies of one declaration to share
# the filter ID of that declaration.
#
global
    daemon

defaults parser-instance-defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

    filter-config otel id parser config "${OTEL_PARSER_CFG}"

frontend parser-frontend
    bind 127.0.0.1:18070

    default_backend parser-backend

frontend parser-frontend-2
    bind 127.0.0.1:18069

    default_backend parser-backend

defaults parser-backend-defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

backend parser-backend
    server server-1 127.0.0.1:18068
