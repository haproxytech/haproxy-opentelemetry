#
# HTTP-mode proxy with a disabled instance of the "otel" filter class and an
# 'otel-group' action naming it, used by the case that checks the groups of a
# disabled instance are resolved like those of an enabled one.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18060

    default_backend parser-backend

    filter-config otel id parser config "${OTEL_PARSER_CFG}"

    http-request otel-group parser parser-group

backend parser-backend
    server server-1 127.0.0.1:18059
