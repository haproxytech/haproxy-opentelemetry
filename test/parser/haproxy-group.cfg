#
# HTTP-mode proxy with an 'otel-group' action, used by the cases that
# check the group name it carries.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18081

    default_backend parser-backend

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

    http-request otel-group parser parser-group

backend parser-backend
    server server-1 127.0.0.1:18080
