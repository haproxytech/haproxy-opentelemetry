#
# HTTP-mode proxy whose filter id is the word 'if', used by the case that
# checks the general name rule on the filter line.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18093

    default_backend parser-backend

    filter opentelemetry id if config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18092
