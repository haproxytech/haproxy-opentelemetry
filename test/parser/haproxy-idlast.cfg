#
# HTTP-mode proxy that writes the filter id after the configuration file, used
# by the cases that check the whole filter line is read before the file is.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18096

    default_backend parser-backend

    filter opentelemetry config "${OTEL_PARSER_CFG}" id parser-section

backend parser-backend
    server server-1 127.0.0.1:18094
