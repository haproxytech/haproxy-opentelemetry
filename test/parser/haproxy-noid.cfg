#
# HTTP-mode proxy whose filter line names no ID, used by the case that checks
# the warning the filter prints and the default ID it falls back to.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18078

    default_backend parser-backend

    filter opentelemetry config "${OTEL_PARSER_CFG}"

backend parser-backend
    server server-1 127.0.0.1:18077
