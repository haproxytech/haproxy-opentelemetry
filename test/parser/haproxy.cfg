#
# HTTP-mode proxy for the configuration parser test.  The OTel configuration
# file of the case being checked is passed in the OTEL_PARSER_CFG variable.
#
global
    daemon

defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend parser-frontend
    bind 127.0.0.1:18099

    default_backend parser-backend

    # A named proxy ACL: the last list a scope condition resolves against.
    acl p-x path_beg /p

    filter opentelemetry id parser config "${OTEL_PARSER_CFG}"

    # A proxy ACL declared below the filter line: too late for the filter.
    acl p-late path_beg /q

backend parser-backend
    server server-1 127.0.0.1:18098
