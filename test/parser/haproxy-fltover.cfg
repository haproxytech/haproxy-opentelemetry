#
# One OTel filter instance written in a defaults section and inherited by two
# proxies, the second of which declares an instance of its own with the same
# filter ID, used by the case that checks an override of an inherited
# declaration to be refused while another proxy keeps the inherited copy.
#
global
    daemon

defaults parser-instance-defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

    filter-config otel id parser config "${OTEL_PARSER_CFG}"

frontend parser-frontend
    bind 127.0.0.1:18120

    default_backend parser-backend

frontend parser-frontend-2
    bind 127.0.0.1:18121

    default_backend parser-backend

    filter-config otel id parser config "${OTEL_PARSER_CFG}"

defaults parser-backend-defaults
    mode http
    timeout connect 5s
    timeout client  30s
    timeout server  30s

backend parser-backend
    server server-1 127.0.0.1:18122
