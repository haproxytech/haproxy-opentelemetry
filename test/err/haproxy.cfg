global
    stats socket /tmp/haproxy.sock mode 666 level admin

listen stats
    mode http
    bind *:8001
    stats uri /
    stats admin if TRUE
    stats refresh 10s

frontend otel-test-err-frontend
    bind *:10080
    default_backend servers-backend

    # OTel filter -- the err/otel.cfg scopes deliberately fail at runtime
    # so the rate-limited error/warning logging can be exercised.
    filter opentelemetry id otel-test-err config err/otel.cfg

backend servers-backend
    server server-1 127.0.0.1:8000
