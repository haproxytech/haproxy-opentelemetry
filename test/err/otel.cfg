[otel-test-err]
    otel-instrumentation otel-test-instrumentation
        debug-level 0x77f
        log localhost:514 local7 debug
        config err/otel.yml
        option dontlog-normal
        no option hard-errors
        no option disabled
        rate-limit 100.0

        scopes session_start
        scopes server_unavailable
        scopes http_response

    # The legitimate root span the other scopes parent under.
    otel-scope session_start
        span "HAProxy session" root
        otel-event on-client-session-start

    # 'orphan span' is created only on on-server-unavailable, which does not
    # fire while the backend is alive, so it is absent from the runtime
    # context on the normal request path.
    otel-scope server_unavailable
        span "orphan span" parent "HAProxy session"
        otel-event on-server-unavailable

    # Every response parents its span under the absent 'orphan span', so span
    # creation fails with "cannot find referenced span/context" -- one runtime
    # error per response, which drives the rate-limited error/warning logging.
    # In soft-errors mode (the default here) the error is swallowed at warning
    # level and the request still completes; switch the instance to hard mode
    # at runtime with 'flt-otel hard-errors' to log at error level and disable
    # the filter for the offending stream.
    otel-scope http_response
        span "HTTP response" parent "orphan span"
            attribute "http.status_code" status
        otel-event on-http-response
