global
    tune.lua.bool-sample-conversion normal
    lua-load lua/otel-lua.lua
    stats socket /tmp/haproxy.sock mode 666 level admin

listen stats
    mode http
    bind *:8001
    stats uri /
    stats admin if TRUE
    stats refresh 10s

frontend otel-test-lua
    bind *:10080
    default_backend servers-backend

    # OTel filter
    filter opentelemetry id otel-test-lua config lua/otel.cfg

    # Store the request method for the OTel scopes
    http-request lua.otel_tag

backend servers-backend
    server server-1 127.0.0.1:8000
