[otel-test-lua]
    otel-instrumentation otel-test-instrumentation
        config lua/otel.yml default
        scopes on_stream_start
        scopes frontend_http_request
        scopes switching_rules_request

    otel-scope on_stream_start
        span "HAProxy session" root
        otel-event on-stream-start

    otel-scope frontend_http_request
        span "HTTP request" parent "HAProxy session"
            attribute "lua.area" lua.otel_area
            attribute "lua.tail" path,lua.otel_tail
        log-record info id 4000 event "lua-request" span "HTTP request" attr "lua.area" lua.otel_area lua.otel_area str(" ") path,lua.otel_tail
        otel-event on-frontend-http-request

    otel-scope switching_rules_request
        span "Switching rules request" parent "HTTP request"
            attribute "lua.method" var(txn.otel_method)
        otel-event on-switching-rules-request
